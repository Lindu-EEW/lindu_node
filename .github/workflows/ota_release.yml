name: Build and Release OTA Firmware

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [esp32s3, esp32_wroom]
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install -U platformio
          pio update

      - name: Inject Version Tag into Code
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          echo "Patching OTAUpdater.h with version: $TAG_NAME"
          sed -i "s/#define CURRENT_VERSION.*/#define CURRENT_VERSION \"$TAG_NAME\"/" src/OTAUpdater.h

      - name: Compile Firmware
        run: |
          pio run -e ${{ matrix.environment }}

      - name: Rename Firmware Binary
        run: |
          mv .pio/build/${{ matrix.environment }}/firmware.bin firmware_${{ matrix.environment }}.bin

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.environment }}
          path: firmware_${{ matrix.environment }}.bin

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all workflow run artifacts
        uses: actions/download-artifact@v4

      - name: Flatten directory structure
        run: |
          mv firmware-esp32s3/firmware_esp32s3.bin .
          mv firmware-esp32_wroom/firmware_esp32_wroom.bin .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: firmware_*.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
