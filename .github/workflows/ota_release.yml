name: Build and Release OTA Firmware

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # S3 tetap memakai env esp32s3.
          # ESP classic dibangun dengan env 4MB (header flash 4MB, aman untuk chip >= 4MB),
          # lalu dipublikasikan sebagai firmware_esp32_wroom.bin sesuai BOARD_VARIANT firmware.
          - environment: esp32s3
            variant: esp32s3
          - environment: esp32_wroom_4mb
            variant: esp32_wroom
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install -U platformio

      - name: Inject Auto-Increment Version Tag
        run: |
          # Menggunakan GitHub Run Number sebagai versi otomatis (misal: v1.4.66)
          TAG_NAME="v1.4.${GITHUB_RUN_NUMBER}"
          echo "Patching OTAUpdater.h with version: $TAG_NAME"
          sed -i "s/#define CURRENT_VERSION.*/#define CURRENT_VERSION \"$TAG_NAME\"/" src/OTAUpdater.h

      - name: Compile Firmware
        shell: bash
        run: |
          set -o pipefail
          pio run -e ${{ matrix.environment }} 2>&1 | tee compile.log

      - name: Output Log on Failure
        if: failure()
        shell: python
        run: |
          try:
              with open('compile.log', 'r') as f:
                  lines = f.readlines()
              err_summary = ''.join(lines[-40:]).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f"::error::{err_summary}")
          except Exception as e:
              print(f"::error::Failed to read compile.log: {e}")

      - name: Upload Compile Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compile-log-${{ matrix.environment }}
          path: compile.log

      - name: Rename Firmware Binary
        run: |
          mv .pio/build/${{ matrix.environment }}/firmware.bin firmware_${{ matrix.variant }}.bin

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.variant }}
          path: firmware_${{ matrix.variant }}.bin

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all workflow run artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          merge-multiple: true
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.4.${{ github.run_number }}
          name: Auto Release v1.4.${{ github.run_number }}
          files: firmware_*.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
